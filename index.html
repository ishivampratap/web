<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Anil Kumar Gautam | NERIST, Arunachal Pradesh</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#eef3f1;--surface:#fff;--ink:#14231f;--muted:#51635e;--pine:#14352e;--pi:#eaf3ef;--glacier:#2a6b8a;--gold:#d99a14;--line:#cfdbd6;
--serif:'Literata',Georgia,serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1a17;--surface:#15251f;--ink:#e6efeb;--muted:#9bb0a8;--pine:#0a1f1a;--glacier:#6bb4d4;--gold:#f0b43a;--line:#27403a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1a17;--surface:#15251f;--ink:#e6efeb;--muted:#9bb0a8;--pine:#0a1f1a;--glacier:#6bb4d4;--gold:#f0b43a;--line:#27403a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--sans)}
a{color:var(--glacier)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.nav{position:sticky;top:0;z-index:20;background:var(--pine);color:var(--pi)}
header.nav .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{font:600 1.05rem var(--serif);color:var(--pi);text-decoration:none;white-space:nowrap}
nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{color:var(--pi);text-decoration:none;padding:8px 11px;border-radius:6px;font-weight:500;font-size:.9rem;white-space:nowrap;opacity:.85}
nav a:hover{opacity:1;background:rgba(255,255,255,.12)}
.hb{background:none;border:1px solid rgba(255,255,255,.4);color:var(--pi);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:.85rem;white-space:nowrap}
.hb.gold{background:var(--gold);border-color:var(--gold);color:#1b1b1b;font-weight:600}
.hero{background:var(--pine);color:var(--pi);position:relative;overflow:hidden;padding:56px 0 150px}
.hero .wrap{display:grid;grid-template-columns:1fr 220px;gap:40px;align-items:center;position:relative;z-index:2}
.hero h1{font:700 clamp(2.1rem,5.5vw,3.6rem)/1.1 var(--serif);margin:0 0 14px}
.role{font-size:1.1rem;margin:0 0 4px}.inst{opacity:.85;margin:0 0 24px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;padding:10px 18px;border-radius:6px;font-weight:600;text-decoration:none;border:1px solid var(--gold)}
.btn.fill{background:var(--gold);color:#1b1b1b}.btn.line{color:var(--pi)}
.photo{width:220px;height:220px;border-radius:50%;background:#1f4d43;border:4px solid var(--gold);display:grid;place-items:center;font:700 3.4rem var(--serif);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.pcol{display:grid;justify-items:center;gap:10px}
.ridge{position:absolute;left:0;bottom:-1px;width:100%;height:140px;z-index:1}
section{padding:56px 0 8px}
h2{font:700 1.8rem/1.2 var(--serif);margin:0 0 6px}
h2::after{content:"";display:block;width:48px;height:4px;background:var(--gold);margin-top:10px;border-radius:2px}
.sub{color:var(--muted);margin:0 0 24px}
h3{font:600 1.1rem/1.3 var(--serif);margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--glacier);border-radius:8px;padding:18px 20px;position:relative}
.card p{margin:0;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 22px 8px}
.tl li::before{content:"";position:absolute;left:-30px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid var(--bg)}
.yr{font-weight:600;color:var(--glacier)}.tl p{margin:2px 0 0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 18px;min-width:130px;position:relative}
.stat b{display:block;font:700 1.6rem var(--serif);color:var(--glacier)}.stat span{color:var(--muted);font-size:.88rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.tabs button{font:500 .9rem var(--sans);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--pine);color:var(--pi);border-color:var(--pine)}
.pub{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 18px;margin:0 0 10px;position:relative}
.pub .t{font-weight:600}.pub .m{color:var(--muted);font-size:.92rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gal figure{margin:0;position:relative}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.gal figcaption{font-size:.88rem;color:var(--muted);padding-top:4px}
.empty{color:var(--muted)}
.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.soc a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--gold);background:var(--pine);color:var(--pi);transition:transform .15s,background .15s}
.soc a:hover,.soc a:focus-visible{background:var(--gold);color:#1b1b1b;transform:translateY(-2px)}
.card .soc{margin-top:0}
footer{margin-top:56px;background:var(--pine);color:var(--pi);padding:24px 0 90px;font-size:.9rem;text-align:center}
.linkb{background:none;border:0;color:var(--gold);cursor:pointer;font:inherit;text-decoration:underline;margin-left:10px}
.edit-only{display:none}
.edit .edit-only{display:inline-block}
.edit [data-k]{outline:1px dashed var(--gold);outline-offset:2px;min-height:1em;cursor:text}
.edit [data-k]:empty::before{content:"(empty)";opacity:.5}
.x{position:absolute;top:6px;right:6px;background:#b3261e;color:#fff;border:0;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:1rem}
.add{margin:8px 0 0;padding:8px 14px;border:1px dashed var(--gold);background:var(--surface);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
.url{display:block;font-size:.8rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--pine);color:var(--pi);padding:10px 20px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:#222;color:#fff;padding:8px 16px;border-radius:8px;z-index:40;display:none;max-width:90%}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:22px;width:min(360px,90%)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-weight:600;margin:12px 0 4px}
dialog input{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#lerr{color:#b3261e;min-height:1.4em;margin:8px 0 0;font-size:.9rem}
.drow{display:flex;gap:10px;margin-top:14px}
.drow button{padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.drow .go{background:var(--pine);color:var(--pi);border-color:var(--pine)}
@media (max-width:720px){.hero{padding:36px 0 120px}.hero .wrap{grid-template-columns:1fr}.photo{width:140px;height:140px;font-size:2.2rem}.pcol{order:-1;justify-items:start}.brand{display:none}nav{margin-left:0}}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function safeUrl(u){u=String(u||'');return /^(https?:|mailto:|\/|#|images\/)/i.test(u)?u:'#'}
function safeLink(u){u=String(u||'').trim();return /^(https?:|mailto:)/i.test(u)?u:'#'}
function get(p){return p.split('.').reduce(function(o,k){return o==null?'':o[k]},D)}
function set(p,v){var a=p.split('.'),o=D;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
function t(p,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+' data-k="'+p+'">'+esc(get(p))+'</'+tag+'>'}
function del(l,i){return '<button class="x edit-only" data-del="'+l+'.'+i+'" aria-label="Remove">&times;</button>'}
function add(l,label){return '<button class="add edit-only" data-add="'+l+'">+ '+label+'</button>'}
function list(l,fn){return D[l].map(function(x,i){return fn(x,i,l+'.'+i)}).join('')}
function sec(id,title,sub,body){return '<section id="'+id+'"><div class="wrap"><h2>'+title+'</h2><p class="sub">'+sub+'</p>'+body+'</div></section>'}
function tl(l){return '<ul class="tl">'+list(l,function(x,i,p){return '<li>'+del(l,i)+t(p+'.yr','span','yr')+t(p+'.title','h3')+t(p+'.sub','p')+'</li>'})+'</ul>'}

 +sec('awards','Awards and recognition','Honours, fellowships, memberships and service',tl('awards')+add('awards','Add award'))
 +sec('gallery','Gallery','Lab, conferences, students and campus',(D.gallery.length?'<div class="gal">'+list('gallery',function(x,i,p){return '<figure>'+del('gallery',i)+'<img src="'+esc(safeUrl(x.url))+'" alt="'+esc(x.cap)+'">'+t(p+'.cap','figcaption')+'</figure>'})+'</div>':'<p class="empty">Photos will appear here.</p>')+'<button class="add edit-only" data-up="gallery+">+ Upload photo</button>')
 +sec('contact','Contact','Students, collaborators and reviewers are welcome to write','<div class="grid"><div class="card"><h3>Email</h3><p>'+(EDIT?t('profile.email','span'):'<a href="mailto:'+esc(P.email)+'">'+esc(P.email)+'</a>')+'</p></div><div class="card"><h3>Office</h3>'+t('profile.address','p')+'</div>'
  +(D.social.length||EDIT?'<div class="card"><h3>Social media</h3>'+(EDIT?socEdit():soc())+add('social','Add social account')+'</div>':'')+'</div>')
 +'<footer><div class="wrap">&copy; '+new Date().getFullYear()+' '+esc(P.name)+', NERIST, Arunachal Pradesh.'+(CAN?'':'<button class="linkb" id="admin">Admin login</button>')+'</div></footer>'
 +(EDIT?'<div class="bar"><span>Editing: click any dashed text to change it.</span><button class="hb gold" id="save">Save and publish</button><button class="hb" id="cancel">Cancel</button></div>':'')+'</div>';
 $('#app').innerHTML=h;
 if(EDIT)document.querySelectorAll('#app [data-k]').forEach(function(e){if(e.tagName!=='SELECT')e.setAttribute('contenteditable','plaintext-only')});
}
function collect(){document.querySelectorAll('#app [data-k]').forEach(function(e){set(e.dataset.k,e.tagName==='SELECT'?e.value:e.textContent.trim())})}
function toast(m){var e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(function(){e.style.display='none'},4000)}

async function pick(cb){
 var i=document.createElement('input');i.type='file';i.accept='image/*';
 i.onchange=async function(){var f=i.files[0];if(!f)return;
  if(!sb){toast('Add your Supabase details first.');return}
  if(f.size>5*1024*1024){toast('Image is over 5 MB. Please use a smaller one.');return}
  var path=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  var r=await sb.storage.from('site-images').upload(path,f);
  if(r.error){toast('Upload failed: '+r.error.message);return}
  cb(sb.storage.from('site-images').getPublicUrl(path).data.publicUrl)};
 i.click()}

async function save(){
 collect();
 if(!sb){toast('Add your Supabase details first.');return}
 var r=await sb.from('site_content').upsert({id:1,data:D,updated_at:new Date().toISOString()});
 if(r.error){toast('Could not save: '+r.error.message);return}
 EDIT=false;render();toast('Saved. Your changes are now live.')}

document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.id==='theme'){var r=document.documentElement,d=getComputedStyle(r).colorScheme.indexOf('dark')>-1;r.setAttribute('data-theme',d?'light':'dark')}
 else if(b.id==='admin'){$('#lerr').textContent='';$('#dlg').showModal()}
 else if(b.id==='edit'){EDIT=true;render()}
 else if(b.id==='cancel'){location.reload()}
 else if(b.id==='save'){save()}
 else if(b.id==='signout'){sb&&sb.auth.signOut()}
 else if(b.dataset.f){F=b.dataset.f;render()}
 else if(b.dataset.add){collect();D[b.dataset.add].push(JSON.parse(JSON.stringify(NEW[b.dataset.add])));render()}
 else if(b.dataset.del){collect();var a=b.dataset.del.split('.');D[a[0]].splice(+a[1],1);render()}
 else if(b.dataset.up){var k=b.dataset.up;pick(function(u){collect();if(k==='gallery+')D.gallery.push({url:u,cap:'Caption'});else set(k,u);render()})}
});
$('#lclose').addEventListener('click',function(){$('#dlg').close()});
$('#login').addEventListener('submit',async function(ev){ev.preventDefault();
 if(!sb){$('#lerr').textContent='Add your Supabase URL and key in index.html first.';return}
 var r=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(r.error){$('#lerr').textContent=r.error.message;return}
 $('#pw').value='';$('#dlg').close()});

(async function(){
 render();
 if(!sb)return;
 try{var r=await sb.from('site_content').select('data').eq('id',1).maybeSingle();
  if(r.data&&r.data.data){D=Object.assign({},DEFAULT,r.data.data);D.social=D.social||[]}}catch(e){}
 try{var s=await sb.auth.getSession();CAN=!!(s.data&&s.data.session)}catch(e){}
 sb.auth.onAuthStateChange(function(ev,session){CAN=!!session;if(!CAN)EDIT=false;render()});
 render();
})();
</script>
</body>
